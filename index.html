<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studyo</title>
    <style>
        :root {
            --primary: #BF092F; 
            --bg: #1a1a1a;
            --sidebar-bg: #252525;
            --text: #ffffff;
            --msg-bg: #333;
            --danger: #ff5555;
            --admin-color: #00d4ff;
            --warning: #ffaa00;
        }

        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: var(--bg); color: var(--text);
            height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden;
            position: relative;
        }

        /* LOGIN */
        #loginPage { text-align: center; background: var(--sidebar-bg); padding: 40px; border-radius: 20px; width: 320px; z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .hidden { display: none !important; }

        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #111; color: white; box-sizing: border-box; font-family: inherit;}
        button { width: 100%; padding: 12px; margin-top: 10px; background: var(--primary); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; user-select: none; color: white;}
        button:hover:not(:disabled) { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .text-btn { background: none; border: none; color: #aaa; font-size: 12px; margin-top: 15px; text-decoration: underline; padding: 0; width: auto; font-weight: normal; }
        .text-btn:hover { color: white; background: none; }

        /* APP LAYOUT */
        #app { display: none; width: 100vw; height: 100vh; flex-direction: row; }
        
        #sidebar { width: 280px; background: var(--sidebar-bg); border-right: 1px solid #333; padding: 20px; display: flex; flex-direction: column; overflow-y: auto;}
        .sidebar-btn { background: #333; color: white; margin-bottom: 10px; text-align: left; padding: 12px; width: 100%; border:none; border-radius:8px; cursor:pointer;}
        .sidebar-btn:hover { background: #444; }

        .list-title { font-size: 11px; color: var(--primary); letter-spacing: 1px; margin: 20px 0 10px 5px; text-transform: uppercase; }
        
        .pref-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
        #themeColor { width: 40px; height: 40px; padding: 0; border: none; border-radius: 8px; cursor: pointer; background: transparent; }
        #themeColor::-webkit-color-swatch-wrapper { padding: 0; }
        #themeColor::-webkit-color-swatch { border: 1px solid #444; border-radius: 8px; }
        .reset-btn { background: #444; color: white; margin: 0; padding: 10px; flex: 1; font-size: 13px; }

        .user-item { 
            padding: 10px; margin-bottom: 5px; background: #2a2a2a; border-radius: 8px; cursor: pointer; 
            display: flex; flex-direction: column; transition: 0.2s; font-size: 14px;
        }
        .user-item-header { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .user-item-controls { display: flex; gap: 4px; margin-top: 6px; justify-content: flex-end; flex-wrap: wrap;}
        
        .user-item:hover { background: #333; }
        .active-chat { border-left: 4px solid var(--primary); background: #333 !important; }
        .blocked-user { opacity: 0.5; }

        .unread-dot { display: inline-block; width: 10px; height: 10px; background: var(--danger); border-radius: 50%; margin-left: 8px; box-shadow: 0 0 5px var(--danger); }
        .online-dot { display: inline-block; width: 8px; height: 8px; background: #44bb44; border-radius: 50%; margin-left: 5px; box-shadow: 0 0 5px #44bb44; vertical-align: middle; }

        .mod-btn { font-size: 10px; padding: 4px 8px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; width: auto; margin: 0; }
        .ban-btn { background: var(--danger); color: white; }
        .unban-btn { background: #44bb44; color: white; }
        .del-user-btn { background: #aa0000; color: white; }
        .block-btn { background: #666; color: white; }
        .kick-btn { background: var(--warning); color: black; }

        /* CHAT AREA & BUBBLES */
        #chat { flex: 1; display: flex; flex-direction: column; background: #111; position: relative; }
        #top { padding: 15px 25px; background: #222; border-bottom: 1px solid #333; font-weight: bold; color: var(--primary); display: flex; justify-content: space-between; align-items: center;}
        
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; list-style: none; margin: 0; }
        
        .msg { 
            max-width: 70%; padding: 12px 16px; border-radius: 18px 18px 18px 4px; 
            background: var(--msg-bg); position: relative; display: flex; flex-direction: column; gap: 5px; 
            animation: fadeIn 0.2s ease-in; box-shadow: 0 2px 5px rgba(0,0,0,0.2); width: fit-content;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .msg.me { 
            align-self: flex-end; background: var(--primary); color: #fff; 
            border-radius: 18px 18px 4px 18px; 
        }
        .msg-header { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px; margin-bottom: 4px;}
        .msg-text { word-break: break-word; font-size: 14px; line-height: 1.4;}
        .msg-img { max-width: 100%; max-height: 250px; border-radius: 8px; margin-top: 5px; object-fit: contain; }
        .msg-info { font-size: 11px; font-weight: bold; color: #ccc; }
        .msg.me .msg-info { color: #f0f0f0; } 
        .timestamp { font-size: 10px; margin-left: 8px; font-weight: normal; opacity: 0.8; }

        .del-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 14px; padding: 0; margin: 0; opacity: 0.4; }
        .del-btn:hover { opacity: 1; }

        .status-text { align-self: flex-end; font-size: 11px; color: #888; margin-top: -6px; margin-bottom: 4px; margin-right: 5px; font-weight: bold; display: flex; align-items: center; gap: 5px; }

        #typingIndicator { padding: 5px 25px; font-size: 11px; color: #888; font-style: italic; min-height: 15px; background: #111; }

        #sendBar { padding: 20px; display: flex; gap: 10px; background: #222; border-top: 1px solid #333; align-items: center; }
        .icon-btn { background: #444; border-radius: 50%; width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; margin: 0; cursor: pointer; padding: 0;}
        .icon-btn:hover { background: #555; }

        /* OVERLAYS (INBOX & ADMIN) */
        .overlay-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 100; display: none; align-items: center; justify-content: center; }
        .modal-container { width: 600px; max-width: 90%; height: 80vh; background: #222; border-radius: 12px; border: 1px solid #444; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-header { padding: 15px 20px; background: #1a1a1a; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;}
        .modal-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 15px; gap: 10px; }
        
        .mail-item { background: #333; padding: 15px; border-radius: 8px; position: relative; border-left: 4px solid transparent; }
        .mail-item.unread { border-left-color: var(--primary); background: #3a3a3a; }
        .mail-title { font-weight: bold; margin-bottom: 5px; color: white; display: flex; justify-content: space-between;}
        .mail-body { font-size: 13px; color: #ccc; margin-top: 8px; white-space: pre-wrap; }
        
        #composeBox { display: none; padding: 15px; background: #1a1a1a; border-top: 1px solid #333; }
        .badge { background: var(--primary); color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-left: 5px; vertical-align: middle; }
        .mail-tabs { display: flex; background: #1a1a1a; border-bottom: 1px solid #333; }
        .mail-tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-size: 13px; background: #222; color: #888; border: none; outline: none; transition: 0.2s;}
        .mail-tab.active { background: #333; color: var(--primary); font-weight: bold; border-bottom: 2px solid var(--primary); }

    </style>
</head>
<body>

<div id="loginPage">
    <h2 style="color:var(--primary)">MESSAGING SITE 1</h2>
    <input id="u" placeholder="Username">
    <input id="p" type="password" placeholder="Password">
    <button id="loginBtn" onclick="auth('login')">Login</button>
    <button id="signupBtn" style="background:#444; color:white" onclick="auth('signup')">Sign Up</button>
    <div id="kickMessage" style="color:var(--warning); margin-top:15px; font-weight:bold; font-size:14px;"></div>
    <button class="text-btn" onclick="requestPasswordReset()">Forgot Password?</button>
</div>

<div id="app">
    <div id="sidebar">
        <h3 id="myUserDisplay" style="color:var(--primary); margin-top:0"> User</h3>
        
        <button class="sidebar-btn" onclick="openGlobalChat()" id="globalChatBtn">🌍 Global Chat</button>
        <button class="sidebar-btn hidden" onclick="toggleInbox()" id="mailboxBtn">📥 Mailbox <span id="inboxCount" class="hidden badge">0</span></button>
        
        <div id="adminPanelToggle" class="hidden">
            <button class="sidebar-btn" style="background:var(--admin-color); color:black; font-weight:bold;" onclick="toggleAdminPanel()">⚙️ Admin Panel</button>
        </div>

        <div class="list-title">Direct Messages</div>
        <div id="userList" style="flex:1; overflow-y:auto; min-height:100px;"></div>

        <div class="list-title">Preferences</div>
        <div class="pref-row">
            <input type="color" id="themeColor" title="Change Theme Color">
            <button class="reset-btn" onclick="resetColor()">Reset Color</button>
        </div>
        
        <button onclick="changePassword()" style="background:#444; color:white; margin-top:15px; font-size: 14px;">Change Password</button>
        <button onclick="logoutUser()" style="background:var(--danger); margin-top:10px; font-size: 14px;">Logout</button>
    </div>

    <div id="chat">
        <div id="top">
            <span id="chatTitle">Select a user to chat</span>
        </div>
        <ul id="messages"></ul>
        
        <div id="typingIndicator" class="hidden"></div>

        <div id="sendBar">
            <button class="icon-btn" onclick="document.getElementById('imgUpload').click()" title="Send Image">📎</button>
            <input type="file" id="imgUpload" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
            <input id="msgInput" placeholder="Type a message..." onkeyup="if(event.key === 'Enter') sendTextMsg()">
            <button onclick="sendTextMsg()" style="width:80px; margin:0">Send</button>
        </div>
    </div>
</div>

<div id="inboxOverlay" class="overlay-bg">
    <div class="modal-container">
        <div class="modal-header">
            <h3 style="margin:0; color:var(--primary)">📥 Mailbox</h3>
            <div>
                <button onclick="toggleCompose()" style="width:auto; padding:8px 15px; margin:0; background:#44bb44;">Compose</button>
                <button onclick="deleteAllMail()" style="width:auto; padding:8px 15px; margin:0 0 0 10px; background:#aa0000;">Delete All</button>
                <button onclick="toggleInbox()" style="width:auto; padding:8px 15px; margin:0 0 0 10px; background:#444;">Close</button>
            </div>
        </div>
        
        <div class="mail-tabs">
            <button class="mail-tab active" id="tabInbox" onclick="switchMailTab('inbox')">Received Mail</button>
            <button class="mail-tab" id="tabSent" onclick="switchMailTab('sent')">Sent Mail / Receipts</button>
        </div>

        <div id="composeBox">
            <input id="mailTo" placeholder="Recipient Username">
            <input id="mailSubject" placeholder="Subject">
            <textarea id="mailBody" placeholder="Type your email here..." rows="4"></textarea>
            <button onclick="sendMail()">Send Mail</button>
        </div>

        <div class="modal-content" id="inboxList">
            <div style="text-align:center; color:#888; margin-top:20px;">Loading emails...</div>
        </div>
        <div class="modal-content hidden" id="sentList">
            <div style="text-align:center; color:#888; margin-top:20px;">Loading sent emails...</div>
        </div>
    </div>
</div>

<div id="adminOverlay" class="overlay-bg">
    <div class="modal-container">
        <div class="modal-header">
            <h3 style="margin:0; color:var(--admin-color)">⚙️ Admin Control Panel</h3>
            <button onclick="toggleAdminPanel()" style="width:auto; padding:8px 15px; margin:0; background:#444;">Close</button>
        </div>
        <div class="modal-content">
            <div class="list-title" style="color:var(--admin-color)">Global Actions</div>
            <button onclick="clearAllStuckTyping()" style="padding:12px; background:var(--warning); color:black;">Clear Stuck Typing Variables</button>
            <button onclick="wipeAllChatsLive()" style="padding:12px; background:var(--danger); color:white;">Delete All Chats Live</button>
            
            <div class="list-title" style="color:var(--admin-color); margin-top:20px;">System Status</div>
            <div style="padding:15px; background:#111; border-radius:8px; font-size:13px; color:#ccc;">
                Everything operating normally. Use user list sidebar to manage individual bans/kicks.
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyB7wjLsAU5XrHhXgXvLblURv8i_5ViBHGE",
        authDomain: "bananamessagingsite.firebaseapp.com",
        databaseURL: "https://bananamessagingsite-default-rtdb.firebaseio.com",
        projectId: "bananamessagingsite",
        storageBucket: "bananamessagingsite.firebasestorage.app",
        messagingSenderId: "540607876740",
        appId: "1:540607876740:web:99505bf5d4e6b665897cd1",
        measurementId: "G-LTKZKNTPWK"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const ADMIN_USER = "banana777";
    let currentUser = null;
    let currentPath = null;
    let activeChatPath = null; 
    let typingTimeout = null; 
    let loginTimerInterval = null;
    let chatListener = null;
    
    let lastSentTime = 0;
    const COOLDOWN_MS = 900;
    const BAD_WORDS = ["fuck", "shit", "67", "epstein", "diddy", "bitch"]; 
    
    let myBlockedUsers = {}; 
    let myUnreadUsers = {};
    let allUsersSnap = null;

    // --- TAB VISIBILITY TRACKER ---
    document.addEventListener("visibilitychange", () => {
        if (currentUser) {
            const isOnline = !document.hidden;
            db.ref("users/" + currentUser + "/online").set(isOnline);
        }
    });

    // --- AUTH & KICK LOGIC ---
    async function auth(type) {
        const u = document.getElementById('u').value.trim().toLowerCase();
        const p = document.getElementById('p').value.trim();
        if(!u || !p) return alert("Fill everything in!");

        const lockedUser = localStorage.getItem('tuff_locked_user');
        if (lockedUser && lockedUser !== u && u !== ADMIN_USER) {
            return alert(`This browser is locked to the account: ${lockedUser}`);
        }

        const fakeEmail = u + "@bananachat.com";

        try {
            if(type === 'signup') {
                await firebase.auth().createUserWithEmailAndPassword(fakeEmail, p);
                await db.ref("users/" + u).set({ banned: false, online: true });
                
                const welcomeId = db.ref("inbox/" + u).push().key;
                db.ref("inbox/" + u + "/" + welcomeId).set({
                    id: welcomeId,
                    from: ADMIN_USER,
                    subject: "Welcome to Studyo!",
                    body: "Welcome to the site. Treat others with respect and follow the rules.",
                    time: Date.now(),
                    read: false
                });

            } else {
                await firebase.auth().signInWithEmailAndPassword(fakeEmail, p);
            }
            
            if (u !== ADMIN_USER) {
                localStorage.setItem('tuff_locked_user', u);
            }
            
            document.getElementById('u').value = "";
            document.getElementById('p').value = "";
            checkKickStatusAndStart(u);
        } catch (error) {
            let cleanMessage = "Something went wrong. Please try again.";
            switch(error.code) {
                case 'auth/wrong-password':
                case 'auth/invalid-credential':
                case 'auth/invalid-login-credentials': cleanMessage = "Incorrect password! Please try again."; break;
                case 'auth/user-not-found': cleanMessage = "User not found. Please sign up first!"; break;
                case 'auth/email-already-in-use': cleanMessage = "That username is already taken! Try another one."; break;
                case 'auth/weak-password': cleanMessage = "Your password is too weak. Make it at least 6 characters."; break;
                default: cleanMessage = "Error: " + error.message; 
            }
            alert(cleanMessage);
        }
    }

    function checkKickStatusAndStart(user) {
        db.ref("users/" + user).once("value", snap => {
            const data = snap.val() || {};
            if (data.kickUntil && data.kickUntil > Date.now()) {
                firebase.auth().signOut();
                showKickTimer(data.kickUntil);
            } else {
                start(user);
            }
        });
    }

    function showKickTimer(timestamp) {
        document.getElementById('app').style.display = 'none';
        document.getElementById('loginPage').classList.remove('hidden');
        
        const loginBtn = document.getElementById("loginBtn");
        const signupBtn = document.getElementById("signupBtn");
        const msgDiv = document.getElementById("kickMessage");
        
        loginBtn.disabled = true;
        signupBtn.disabled = true;
        
        if(loginTimerInterval) clearInterval(loginTimerInterval);
        
        loginTimerInterval = setInterval(() => {
            const remaining = Math.ceil((timestamp - Date.now()) / 1000);
            if (remaining <= 0) {
                clearInterval(loginTimerInterval);
                msgDiv.innerText = "";
                loginBtn.disabled = false;
                signupBtn.disabled = false;
            } else {
                msgDiv.innerText = `You have been kicked.\nWait ${remaining}s before logging in.`;
            }
        }, 1000);
    }

    function requestPasswordReset() {
        const u = prompt("Enter your exact username. The admin will be emailed to wipe your account so you can remake it:");
        if (u) {
            const mailId = db.ref("inbox/" + ADMIN_USER).push().key;
            db.ref("inbox/" + ADMIN_USER + "/" + mailId).set({
                id: mailId,
                from: "System",
                subject: "🚨 Password Reset Request",
                body: `User "${u.trim().toLowerCase()}" forgot their password and requested an account wipe.\n\nPlease delete their Auth account in the Firebase Console so they can sign up again.`,
                time: Date.now(),
                read: false
            });
            alert("The admin has been emailed! Try signing up again later once they clear your account.");
        }
    }

    function cleanText(text) {
        let clean = text;
        BAD_WORDS.forEach(word => {
            const regex = new RegExp(word, "gi");
            clean = clean.replace(regex, "***");
        });
        return clean;
    }

    // --- MAIN APP INITIALIZATION ---
    function start(user) {
        currentUser = user;
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('app').style.display = 'flex';
        document.getElementById('myUserDisplay').innerText = (currentUser === ADMIN_USER ? "👑 " : "👤 ") + currentUser;
        
        // ADMIN ONLY UNHIDE MAILBOX
        if(currentUser === ADMIN_USER) {
            document.getElementById('adminPanelToggle').classList.remove('hidden');
            document.getElementById('mailboxBtn').classList.remove('hidden');
        }

        db.ref("users/" + currentUser + "/themeColor").on("value", snap => {
            const savedColor = snap.val() || "#BF092F";
            document.documentElement.style.setProperty('--primary', savedColor);
            document.getElementById('themeColor').value = savedColor;
        });

        document.getElementById('themeColor').addEventListener('input', (e) => {
            const color = e.target.value;
            document.documentElement.style.setProperty('--primary', color);
            db.ref("users/" + currentUser + "/themeColor").set(color);
        });

        const connectedRef = db.ref(".info/connected");
        const myOnlineRef = db.ref("users/" + currentUser + "/online");
        
        connectedRef.on("value", (snap) => {
            if (snap.val() === true && !document.hidden) {
                myOnlineRef.onDisconnect().set(false).then(() => {
                    myOnlineRef.set(true);
                });
            }
        });

        db.ref("users/" + currentUser).on("value", snap => {
            if(!snap.exists()) {
                alert("Your account data has been deleted by an admin.");
                location.reload();
            } else {
                const data = snap.val();
                if(data.banned === true) {
                    alert("You've been banned!");
                    location.reload();
                } else if (data.kickUntil && data.kickUntil > Date.now()) {
                    myOnlineRef.set(false).then(() => {
                        firebase.auth().signOut();
                        showKickTimer(data.kickUntil);
                    });
                }
            }
        });

        db.ref("users/" + currentUser + "/blocked").on("value", snap => {
            myBlockedUsers = snap.val() || {};
            renderUserList(); 
        });

        db.ref("users/" + currentUser + "/unread").on("value", snap => {
            myUnreadUsers = snap.val() || {};
            renderUserList();
        });

        // Listen for Inbox Mail
        db.ref("inbox/" + currentUser).on("value", snap => {
            const mails = snap.val() || {};
            let unreadCount = 0;
            const list = document.getElementById('inboxList');
            list.innerHTML = "";
            
            const sortedMails = Object.keys(mails).map(k => ({...mails[k]})).sort((a,b) => b.time - a.time);
            
            if(sortedMails.length === 0) {
                list.innerHTML = `<div style="text-align:center; color:#888; margin-top:20px;">Your inbox is empty.</div>`;
            }

            sortedMails.forEach(mail => {
                if(!mail.read) unreadCount++;
                let timeStr = new Date(mail.time).toLocaleString([], {month:'short', day:'numeric', hour: '2-digit', minute:'2-digit'});
                
                const div = document.createElement('div');
                div.className = `mail-item ${mail.read ? '' : 'unread'}`;
                div.innerHTML = `
                    <div class="mail-title">
                        <span>${mail.subject}</span>
                        <span style="font-size:10px; color:#aaa; font-weight:normal;">${timeStr}</span>
                    </div>
                    <div style="font-size:11px; color:var(--primary); margin-top:2px;">From: ${mail.from}</div>
                    <div class="mail-body">${mail.body}</div>
                    <div style="margin-top:10px; text-align:right;">
                        <button onclick="deleteMail('${mail.id}')" style="background:transparent; border:1px solid #aa0000; color:#ff5555; width:auto; padding:4px 8px; font-size:11px;">Delete</button>
                        ${!mail.read ? `<button onclick="markMailRead('${mail.id}', '${mail.from}')" style="background:#444; width:auto; padding:4px 8px; font-size:11px; margin-left:5px;">Mark Read</button>` : ''}
                    </div>
                `;
                list.appendChild(div);
            });

            const badge = document.getElementById('inboxCount');
            if(unreadCount > 0) {
                badge.innerText = unreadCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        });

        // Listen for Sent Mail Status
        db.ref("sent/" + currentUser).on("value", snap => {
            const mails = snap.val() || {};
            const list = document.getElementById('sentList');
            list.innerHTML = "";
            const sortedMails = Object.keys(mails).map(k => ({...mails[k]})).sort((a,b) => b.time - a.time);
            
            if(sortedMails.length === 0) {
                list.innerHTML = `<div style="text-align:center; color:#888; margin-top:20px;">You haven't sent any emails.</div>`;
            }

            sortedMails.forEach(mail => {
                let timeStr = new Date(mail.time).toLocaleString([], {month:'short', day:'numeric', hour: '2-digit', minute:'2-digit'});
                let statusBadge = mail.read ? `<span style="color:#44bb44; font-size:11px; font-weight:bold;">✓ Opened</span>` : `<span style="color:#ffaa00; font-size:11px; font-weight:bold;">✉ Unread</span>`;
                
                const div = document.createElement('div');
                div.className = `mail-item`;
                div.innerHTML = `
                    <div class="mail-title">
                        <span>${mail.subject}</span>
                        <span style="font-size:10px; color:#aaa; font-weight:normal;">${timeStr}</span>
                    </div>
                    <div style="font-size:11px; color:#888; margin-top:2px;">To: ${mail.to} &nbsp; | &nbsp; Status: ${statusBadge}</div>
                    <div class="mail-body">${mail.body}</div>
                `;
                list.appendChild(div);
            });
        });

        loadUsers();
        openGlobalChat();
    }

    // --- INBOX & MAIL LOGIC ---
    function toggleInbox() {
        const overlay = document.getElementById('inboxOverlay');
        overlay.style.display = overlay.style.display === 'flex' ? 'none' : 'flex';
        document.getElementById('composeBox').style.display = 'none';
    }
    
    function toggleAdminPanel() {
        const overlay = document.getElementById('adminOverlay');
        overlay.style.display = overlay.style.display === 'flex' ? 'none' : 'flex';
    }

    function toggleCompose() {
        const box = document.getElementById('composeBox');
        box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    function switchMailTab(tab) {
        document.getElementById('tabInbox').classList.remove('active');
        document.getElementById('tabSent').classList.remove('active');
        document.getElementById('inboxList').classList.add('hidden');
        document.getElementById('sentList').classList.add('hidden');
        
        if (tab === 'inbox') {
            document.getElementById('tabInbox').classList.add('active');
            document.getElementById('inboxList').classList.remove('hidden');
        } else {
            document.getElementById('tabSent').classList.add('active');
            document.getElementById('sentList').classList.remove('hidden');
        }
    }

    async function sendMail() {
        const to = document.getElementById('mailTo').value.trim().toLowerCase();
        const sub = document.getElementById('mailSubject').value.trim();
        const body = document.getElementById('mailBody').value.trim();

        if(!to || !sub || !body) return alert("Fill in all fields!");

        db.ref("users/" + to).once("value", async snap => {
            if(!snap.exists() && to !== ADMIN_USER) return alert("User not found!");
            
            const mailId = db.ref("inbox/" + to).push().key;
            const mailData = {
                id: mailId,
                from: currentUser,
                to: to,
                subject: cleanText(sub),
                body: cleanText(body),
                time: Date.now(),
                read: false
            };

            try {
                // Wait for both to send, then hide the box and swap tabs so they see it sent!
                await db.ref("inbox/" + to + "/" + mailId).set(mailData);
                await db.ref("sent/" + currentUser + "/" + mailId).set(mailData);
                
                alert("Mail Sent!");
                document.getElementById('mailTo').value = "";
                document.getElementById('mailSubject').value = "";
                document.getElementById('mailBody').value = "";
                
                document.getElementById('composeBox').style.display = 'none';
                switchMailTab('sent');
            } catch (err) {
                alert("Failed to send mail: " + err.message);
            }
        });
    }

    function deleteMail(id) {
        if(confirm("Delete this email?")) {
            db.ref("inbox/" + currentUser + "/" + id).remove();
        }
    }

    function deleteAllMail() {
        if(confirm("Are you sure you want to delete ALL your Inbox and Sent mail?")) {
            db.ref("inbox/" + currentUser).remove();
            db.ref("sent/" + currentUser).remove();
            alert("All mail deleted!");
        }
    }

    function markMailRead(id, sender) {
        db.ref("inbox/" + currentUser + "/" + id).update({ read: true });
        if(sender && sender !== "System") {
            db.ref("sent/" + sender + "/" + id).update({ read: true });
        }
    }

    // --- PREFERENCES & ADMIN UTILS ---
    function resetColor() {
        const defaultColor = "#BF092F";
        document.getElementById('themeColor').value = defaultColor;
        document.documentElement.style.setProperty('--primary', defaultColor);
        db.ref("users/" + currentUser + "/themeColor").remove();
    }

    function clearAllStuckTyping() {
        if(confirm("Clear all typing indicators from the database?")) {
            db.ref("typing").remove().then(() => alert("Stuck typing cleared!"));
        }
    }
    
    function wipeAllChatsLive() {
        if(confirm("Delete ALL message history?")) {
            db.ref("messages").remove().then(() => alert("Chat history completely wiped."));
        }
    }

    function logoutUser() {
        if(currentUser) {
            db.ref("users/" + currentUser + "/online").set(false);
            firebase.auth().signOut().then(() => {
                location.reload();
            }).catch(() => location.reload());
        } else {
            location.reload();
        }
    }

    async function changePassword() {
        if(!currentUser) return;
        const newPass = prompt("Enter your new password (must be at least 6 characters):");
        if(newPass && newPass.trim().length >= 6) {
            try {
                const user = firebase.auth().currentUser;
                await user.updatePassword(newPass.trim());
                alert("Password successfully changed!");
            } catch(error) {
                alert("Error changing password: " + error.message);
            }
        } else if (newPass !== null) {
            alert("Password must be at least 6 characters long.");
        }
    }

    // --- CHAT & USERS LOGIC ---
    function loadUsers() {
        db.ref("users").on("value", snap => {
            allUsersSnap = snap;
            renderUserList();
        });
    }

    function renderUserList() {
        if(!allUsersSnap) return;
        const list = document.getElementById("userList");
        list.innerHTML = "";
        
        allUsersSnap.forEach(child => {
            const u = child.key;
            if (u === currentUser) return; // Don't show yourself
            
            const data = child.val();
            const isOnline = data.online ? '<span class="online-dot" title="Online"></span>' : '';
            const isUnread = myUnreadUsers[u] ? '<span class="unread-dot" title="New Message"></span>' : '';
            const isBlocked = myBlockedUsers[u];
            
            const div = document.createElement("div");
            div.className = `user-item ${isBlocked ? 'blocked-user' : ''}`;
            
            // Build Mod controls if admin
            let modControls = "";
            if (currentUser === ADMIN_USER) {
                modControls = `
                    <div class="user-item-controls">
                        <button class="mod-btn kick-btn" onclick="kickUser('${u}', event)">Kick 15m</button>
                        ${data.banned ? 
                          `<button class="mod-btn unban-btn" onclick="unbanUser('${u}', event)">Unban</button>` : 
                          `<button class="mod-btn ban-btn" onclick="banUser('${u}', event)">Ban</button>`
                        }
                    </div>
                `;
            }

            div.innerHTML = `
                <div class="user-item-header">
                    <span>👤 ${u} ${isOnline} ${isUnread}</span>
                </div>
                ${modControls}
            `;
            
            div.onclick = () => openChat(u);
            list.appendChild(div);
        });
    }

    function openGlobalChat() {
        currentPath = "messages/global";
        activeChatPath = null;
        document.getElementById('chatTitle').innerText = "🌍 Global Chat";
        loadChat();
    }

    function openChat(user) {
        if (myBlockedUsers[user]) {
            if(!confirm("You blocked this user. Unblock them to chat?")) return;
            db.ref("users/" + currentUser + "/blocked/" + user).remove();
        }
        
        db.ref("users/" + currentUser + "/unread/" + user).remove();
        
        const path = [currentUser, user].sort().join("_");
        currentPath = "messages/" + path;
        activeChatPath = user;
        document.getElementById('chatTitle').innerText = "👤 Chat with " + user;
        loadChat();
    }

    function loadChat() {
        if(chatListener) db.ref(chatListener).off();
        chatListener = currentPath;
        
        const ul = document.getElementById("messages");
        ul.innerHTML = "";
        
        db.ref(currentPath).on("child_added", snap => {
            const msg = snap.val();
            const li = document.createElement("li");
            
            // RIGHT SIDE FIX: check if msg.sender === currentUser and apply the .me class
            const isMe = msg.sender === currentUser;
            li.className = `msg ${isMe ? 'me' : ''}`;
            
            // UNDEFINED FIX: Provide fallback if missing, but msg.sender should be set now!
            const senderName = msg.sender || "Unknown";

            let contentHtml = "";
            if (msg.type === 'image') {
                contentHtml = `<img src="${msg.text}" class="msg-img">`;
            } else {
                contentHtml = `<div class="msg-text">${msg.text}</div>`;
            }

            let delBtn = "";
            if (currentUser === ADMIN_USER || isMe) {
                delBtn = `<button class="del-btn" onclick="deleteMessage('${snap.key}')">×</button>`;
            }

            li.innerHTML = `
                <div class="msg-header">
                    <span class="msg-info">${senderName}</span>
                    <span class="timestamp">${new Date(msg.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                    ${delBtn}
                </div>
                ${contentHtml}
            `;
            
            ul.appendChild(li);
            ul.scrollTop = ul.scrollHeight;
        });

        db.ref(currentPath).on("child_removed", snap => {
            loadChat(); // reload chat on delete
        });
    }

    function deleteMessage(msgId) {
        if(confirm("Delete this message?")) {
            db.ref(currentPath + "/" + msgId).remove();
        }
    }

    // IMAGE SENDING FIX: Handle file upload
    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        // Convert image to Base64 String so it can be saved directly in Firebase Database easily
        const reader = new FileReader();
        reader.onload = function(e) {
            const base64Str = e.target.result;
            sendMsg(base64Str, 'image');
        };
        reader.readAsDataURL(file);
        
        // Reset the input so you can send the same image again if you want
        event.target.value = ''; 
    }

    function sendTextMsg() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (!text) return;
        
        if (Date.now() - lastSentTime < COOLDOWN_MS) {
            return alert("Sending too fast! Wait a second.");
        }
        
        sendMsg(cleanText(text), 'text');
        input.value = '';
        lastSentTime = Date.now();
    }

    function sendMsg(content, type) {
        if (!currentPath) return alert("Select a chat first!");
        
        const msgId = db.ref(currentPath).push().key;
        db.ref(currentPath + "/" + msgId).set({
            id: msgId,
            sender: currentUser,  // THIS FIXES "UNDEFINED"
            text: content,
            type: type,
            time: Date.now()
        });

        // Notify other user if it's a DM
        if (activeChatPath) {
            db.ref("users/" + activeChatPath + "/unread/" + currentUser).set(true);
        }
    }

    // ADMIN COMMANDS
    function banUser(user, event) {
        event.stopPropagation();
        if(confirm("Ban " + user + " permanently?")) {
            db.ref("users/" + user).update({banned: true});
        }
    }
    
    function unbanUser(user, event) {
        event.stopPropagation();
        db.ref("users/" + user).update({banned: false});
    }

    function kickUser(user, event) {
        event.stopPropagation();
        if(confirm("Kick " + user + " for 15 minutes?")) {
            const until = Date.now() + (15 * 60 * 1000);
            db.ref("users/" + user).update({kickUntil: until});
        }
    }
</script>
